version: '3.8'

services:
  redis:
    image: redis:alpine

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pulse_check
      POSTGRES_USER: pulse_check
      POSTGRES_PASSWORD: pulse_check
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/1
      DEBUG: "True"
    depends_on:
      - redis
      - db

  worker:
    build: .
    command: celery -A pulse_check worker --loglevel=info
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - redis
      - web

volumes:
  postgres_data: